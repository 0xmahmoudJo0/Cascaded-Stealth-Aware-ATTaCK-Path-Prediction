paths:
  data_dir: data
  outputs_dir: outputs
  sightings_csv: datasets/sightings_v2_public.csv
  windows_apt_dataset_dir: "datasets/Windows-APT 2025 A Dataset for APT-Inspired Attack"
  sigma_rules_dir: sigma-rules/windows
  sequences_parquet: data/sequences.parquet
  sequences_legacy_parquet: data/sequences_legacy.parquet
  sequences_windows_apt_parquet: data/sequences_windows_apt.parquet
  enterprise_attack_json: data/enterprise-attack.json
  counts_unigram_parquet: data/counts_unigram.parquet
  counts_bigram_parquet: data/counts_bigram.parquet
  counts_trigram_parquet: data/counts_trigram.parquet
  tech_embeddings_npy: outputs/tech_embeddings.npy
  tech_index_csv: outputs/tech_index.csv
  word2vec_model: outputs/word2vec.model
  attacker_profiles_parquet: data/attacker_profiles.parquet
  paths_top_k_json: outputs/paths_topK.json
  metrics_json: outputs/metrics.json
  sigma_stealth_csv: data/sigma_stealth.csv
  sigma_rule_details_json: outputs/sigma_rule_details.json
  tactic_mapping_json: data/technique_tactic_map.json
  tactic_transitions_json: data/tactic_transitions.json
params:
  default:
    lambda: 5.0
    eta: 0.7
    kappa: 10.0
    tau: 5.0
    k_history: 3
    rho: 2.0
    beta: 1.0
    tau_decay: 365
    w_count: 0.55
    w_emb: 0.2
    w_prior: 0.15
    w_stealth: 0.1
    w_tactic: 0.1
    epsilon: 1.0e-09
  word2vec:
    vector_size: 128
    window: 4
    min_count: 5
    sg: 1
    negative: 10
    epochs: 12
  beam_search:
    beam_width: 200
    max_depth: 6
    top_k_paths: 100
    top_n_candidates: 200
  eval:
    train_test_split: 0.8
    temporal_split: true
    k_values: [1, 3, 5, 10, 20]
  attacker_profiles:
    max_hdbscan_campaigns: 80000
    min_cluster_size: 10
    heartbeat_interval: 30
    approx_predict_batch_size: 25000
data_sources:
  default: both
  choices: [legacy, windows-apt, both]
