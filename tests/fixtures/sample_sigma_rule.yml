title: PowerShell Suspicious Command Line
id: 12345678-1234-1234-1234-123456789012
status: experimental
description: Detects suspicious PowerShell command line parameters
author: Test Author
date: 2023/01/01
modified: 2023/01/01
level: high
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image: 'powershell.exe'
        CommandLine: 
            - '*Invoke-Expression*'
            - '*IEX*'
            - '*DownloadString*'
    condition: selection
falsepositives:
    - Legitimate PowerShell scripts
    - System administration tools
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1059.003
